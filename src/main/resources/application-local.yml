# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, relaxes actuator,
# enables debug logging.
# Run infrastructure with: docker compose up postgres-auditservice rabbitmq-auditservice
# ===================================================================

spring:
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/system/db.changelog-system.xml
    contexts: demo

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

iqkv:
  messaging:
    rabbitmq:
      enabled: true
  liquibase:
    system-change-log: db/changelog/system/db.changelog-system.xml
    tenant-change-log: db/changelog/tenant/db.changelog-tenant.xml
