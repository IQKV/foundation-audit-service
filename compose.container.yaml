services:
  # PostgreSQL Database for Audit Service
  postgres-audit:
    extends:
      file: compose.base.yaml
      service: postgres-audit

  # RabbitMQ for Audit Service
  rabbitmq-audit:
    extends:
      file: compose.base.yaml
      service: rabbitmq-audit

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

  # Audit Service - Full platform run including build phase
  audit-service:
    extends:
      file: compose.base.yaml
      service: audit-service

networks:
  audit-service-network:
    name: foundation-audit-network-dev
    external: false

volumes:
  postgres_audit_data:
    name: iqkv_audit_postgres_data_dev
  rabbitmq_audit_data:
    name: iqkv_audit_rabbitmq_data_dev
  dbgate_audit_data:
    name: iqkv_audit_dbgate_data_dev
  audit_logs:
    name: iqkv_audit_logs_dev
  audit_tmp:
    name: iqkv_audit_tmp_dev
